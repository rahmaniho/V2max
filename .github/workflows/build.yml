name: Build V2max APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:
    inputs:
      capture_ui:
        description: "Capture a disposable emulator home-screen preview"
        required: false
        type: boolean
        default: false
      security_only:
        description: "Run targeted security/backup emulators only (no release APK or VPN smoke)"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "After owner security review: test and publish the approved main commit"
        required: false
        type: boolean
        default: false
      publish_test_release:
        description: "Publish an isolated, separately signed preview from an arena branch"
        required: false
        type: boolean
        default: false
      validate_preview:
        description: "Build and test an isolated preview as an artifact only; never publish"
        required: false
        type: boolean
        default: false
      ui_diagnostics:
        description: "Run targeted UI/VPN fixture diagnostics only; never publish"
        required: false
        type: boolean
        default: false

env:
  LIBV2RAY_VERSION: v26.10.21
  LIBV2RAY_SHA256: e56ec3b06485fe7b37af26948673951edf719c50d6bbc618b8539045952adde4
  XRAY_LINUX_SHA256: 0eec3ed4163c273d8c8bf821f7d219e257921cf584aa3fb970715e458e631978

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.security_only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify automation consent backup exclusions and release guards
        run: |
          python3 scripts/verify-backup-rules.py
          python3 scripts/test-diagnostic-privacy.py
          python3 scripts/test-apk-payload.py
          python3 scripts/test-release-metadata.py
          python3 scripts/test-release-draft.py
          python3 scripts/test-release-gates.py
          python3 scripts/test-release-publish.py
          python3 scripts/test-preview-apk.py
          python3 scripts/test-preview-release.py
          python3 scripts/test-android-ui-connect-smoke.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Cache Xray core (libv2ray.aar)
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: libv2ray-${{ env.LIBV2RAY_VERSION }}

      - name: Download Xray core
        run: |
          mkdir -p app/libs
          if [ ! -s app/libs/libv2ray.aar ]; then
            curl -fL --retry 3 -o app/libs/libv2ray.aar \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/${{ env.LIBV2RAY_VERSION }}/libv2ray.aar"
          fi
          printf '%s  %s\n' "$LIBV2RAY_SHA256" app/libs/libv2ray.aar | sha256sum --check
          ls -la app/libs

      - name: Download matching Xray executable for compatibility tests
        run: |
          mkdir -p "$RUNNER_TEMP/xray"
          curl -fL --retry 3 -o "$RUNNER_TEMP/xray.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${LIBV2RAY_VERSION}/Xray-linux-64.zip"
          printf '%s  %s\n' "$XRAY_LINUX_SHA256" "$RUNNER_TEMP/xray.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/xray.zip" -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          echo "TEST_XRAY_BIN=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

      - name: Run unit and local Xray integration tests
        if: ${{ !inputs.ui_diagnostics }}
        run: |
          set -o pipefail
          # :core:testsuite is a plain JVM module, so it has no
          # testReleaseUnitTest; it must be named explicitly or its checks never
          # run and a regression in link parsing or config generation would ship.
          gradle --no-daemon :core:testsuite:test testReleaseUnitTest 2>&1 | tee test-out.log

      - name: Verify the core suite actually ran
        if: ${{ !inputs.ui_diagnostics }}
        run: |
          set -e
          # Guards against the suite being silently skipped again: if the task
          # is ever renamed or dropped from the invocation above, this fails the
          # build instead of reporting success over tests that never executed.
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          paths = glob.glob('core/*/build/test-results/**/*.xml', recursive=True)
          if not paths:
              print('::error title=core-tests::no core test results — :core:testsuite:test did not run')
              sys.exit(1)
          total = 0
          for p in paths:
              for _ in ET.parse(p).iter('testcase'):
                  total += 1
          if total < 1:
              print('::error title=core-tests::core test results contain no test cases')
              sys.exit(1)
          print(f'core suite ran: {total} test case(s) across {len(paths)} result file(s)')

          # Local-Xray tests are intentionally optional on developer machines.
          # CI downloads the pinned executable, so none may be silently skipped here.
          xray_paths = glob.glob('app/build/test-results/**/TEST-*XrayIntegrationTest.xml', recursive=True)
          if not xray_paths:
              print('::error title=xray-tests::no Xray integration results')
              sys.exit(1)
          cases = [case for p in xray_paths for case in ET.parse(p).iter('testcase')]
          if len(cases) < 3 or any(case.find('skipped') is not None for case in cases):
              print('::error title=xray-tests::Xray integration tests missing or skipped')
              sys.exit(1)
          print(f'Xray integration suite ran: {len(cases)} unskipped test case(s)')
          PY

      - name: Verify the app unit tests actually ran
        if: ${{ !inputs.ui_diagnostics }}
        run: |
          set -e
          # Same guard, other direction. Gradle test tasks pick classes up by
          # pattern or by scanning, and a class named outside the convention can
          # be silently excluded — the build stays green over tests that never
          # ran. So assert the specific comparison suite executed, by name.
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          paths = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          if not paths:
              print('::error title=app-tests::no app test results — testReleaseUnitTest did not run')
              sys.exit(1)
          cases = [tc for p in paths for tc in ET.parse(p).iter('testcase')]
          required = {
              'ir.v2max.app.ConfigGeneratorTest': 1,
              'ir.v2max.app.StartupHealthTest': 20,
              'ir.v2max.app.StartupMaintenanceTest': 2,
              'ir.v2max.app.ConnectionTestBarrierTest': 3,
              'ir.v2max.app.HealthScannerTest': 18,
              'ir.v2max.app.NativeDelayTest': 2,
              'ir.v2max.app.NetworkProbeSummaryTest': 1,
              'ir.v2max.app.ServerFingerprintTest': 2,
              'ir.v2max.app.RepoConcurrencyTest': 23,
              'ir.v2max.app.LinkParserCompletenessTest': 2,
              'ir.v2max.app.SubscriptionBootstrapTest': 15,
              'ir.v2max.app.SubscriptionRefreshTest': 10,
              'ir.v2max.app.PreflightTest': 1,
              'ir.v2max.app.VpnPermissionQueueTest': 1,
          }
          for name, minimum in required.items():
              suite = [tc for tc in cases if (tc.get('classname') or '').startswith(name)]
              if len(suite) < minimum or any(tc.find('skipped') is not None for tc in suite):
                  print(f'::error title=app-tests::{name} has {len(suite)} cases or was skipped; expected at least {minimum} unskipped')
                  sys.exit(1)
              print(f'{name}: {len(suite)} unskipped test case(s)')
          print(f'app unit tests ran: {len(cases)} test case(s) across {len(paths)} file(s)')
          PY

      - name: Report test failures
        if: ${{ always() && !inputs.ui_diagnostics }}
        run: |
          if [ -f test-out.log ]; then
            grep -E "^e: |FAILED|tests completed|AssertionError|Exception|error:" test-out.log | head -40 | while IFS= read -r line; do
              echo "::error title=tests::$line"
            done
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          patterns = [
              'app/build/test-results/**/*.xml',
              'core/*/build/test-results/**/*.xml',
          ]
          paths = [p for pat in patterns for p in glob.glob(pat, recursive=True)]
          for path in paths:
              for case in ET.parse(path).iter('testcase'):
                  for failure in case.findall('failure'):
                      msg = (failure.get('message') or failure.text or '')[:8000]
                      msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY

      - name: Build CI-only release-variant APKs
        if: ${{ !inputs.ui_diagnostics }}
        id: build_apk
        # The production key is never available to Gradle, tests or emulators.
        # The default debug signer is ephemeral and cannot update real installs.
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build-out.log
        continue-on-error: true

      - name: Report compile errors as annotations
        if: ${{ always() && !inputs.ui_diagnostics }}
        env:
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" != success ] && [ -f build-out.log ]; then
            grep -E "^e: |error:|FAILURE:|What went wrong|Caused by|Missing class|R8:|Execution failed" build-out.log | head -20 | while IFS= read -r line; do
              echo "::error title=build::$line"
            done
            tail -25 build-out.log | while IFS= read -r line; do
              echo "::error title=tail::$line"
            done
          fi
          if [ "$BUILD_OUTCOME" != success ]; then
            echo "::error title=build::release APK task did not succeed"
            exit 1
          fi
          if [ ! -d app/build/outputs/apk/release ] || [ -z "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)" ]; then
            echo "::error title=build::no APK produced"
            exit 1
          fi

      - name: Exercise re-signing and reject the CI-only signer
        if: ${{ !inputs.ui_diagnostics }}
        env:
          V2MAX_RELEASE_KEYSTORE: ${{ runner.temp }}/v2max-resign-test.jks
          V2MAX_RELEASE_STORE_PASSWORD: v2max-ci-only
          V2MAX_RELEASE_KEY_ALIAS: v2max-ci
          V2MAX_RELEASE_KEY_PASSWORD: v2max-ci-only
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$V2MAX_RELEASE_KEYSTORE" -storepass "$V2MAX_RELEASE_STORE_PASSWORD" \
            -keypass "$V2MAX_RELEASE_KEY_PASSWORD" -alias "$V2MAX_RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=V2max CI only' -storetype JKS
          bash scripts/resign-release-apks.sh app/build/outputs/apk/release "$RUNNER_TEMP/resigned-ci"
          python3 scripts/verify-release-metadata.py "$RUNNER_TEMP/resigned-ci"
          set +e
          output=$(bash scripts/verify-release-signing.sh "$RUNNER_TEMP/resigned-ci" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ] || ! grep -Fq 'Signer mismatch' <<< "$output"; then
            printf '%s\n' "$output"
            echo '::error::Signing guard did not detect the incompatible CI key'
            exit 1
          fi
          echo 'Release guard correctly rejected the ephemeral CI signer.'

      - name: Build isolated preview and its instrumentation APK
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/arena/') && (inputs.publish_test_release || inputs.validate_preview) && !inputs.security_only && !inputs.publish_release && !inputs.ui_diagnostics
        env:
          V2MAX_PREVIEW_KEYSTORE: ${{ runner.temp }}/v2max-preview-only.jks
          V2MAX_PREVIEW_STORE_PASSWORD: v2max-preview-ci-only
          V2MAX_PREVIEW_KEY_ALIAS: v2max-preview-ci
          V2MAX_PREVIEW_KEY_PASSWORD: v2max-preview-ci-only
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$V2MAX_PREVIEW_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$V2MAX_PREVIEW_KEYSTORE" -storepass "$V2MAX_PREVIEW_STORE_PASSWORD" \
            -keypass "$V2MAX_PREVIEW_KEY_PASSWORD" -alias "$V2MAX_PREVIEW_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=V2max isolated preview only' -storetype JKS
          status=0
          gradle --no-daemon :app:assemblePreview :app:assemblePreviewAndroidTest -Pv2maxPreviewInstrumentation=true 2>&1 | tee preview-build.log || status=$?
          if (( status != 0 )); then
            python3 - <<'PY'
          import pathlib
          lines = pathlib.Path('preview-build.log').read_text(errors='replace').splitlines()
          relevant = [line for line in lines if any(word in line for word in ('e: ', 'error:', 'FAILURE:', 'What went wrong', 'Caused by:', 'Execution failed'))]
          text = '\n'.join((relevant or lines[-20:])[-20:])[-3400:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Preview build::{text}')
          PY
            exit "$status"
          fi

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android VPN/TUN smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          V2MAX_CAPTURE_UI: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_ui && 'true' || 'false' }}
          V2MAX_UI_ONLY: ${{ inputs.ui_diagnostics && 'true' || 'false' }}
          V2MAX_PREVIEW_SMOKE: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/arena/') && (inputs.publish_test_release || inputs.validate_preview) && !inputs.security_only && !inputs.publish_release && !inputs.ui_diagnostics && 'true' || 'false' }}
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-android-vpn-smoke.sh

      - name: Android 35 update permission and signer smoke test
        if: ${{ !inputs.ui_diagnostics }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-android-update-smoke.sh

      - name: Android 35 UI VPN consent and selected-server smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          V2MAX_UI_ONLY: "true"
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-android-vpn-smoke.sh

      - name: Upload CI-only APKs (not a production update)
        if: ${{ !inputs.ui_diagnostics }}
        uses: actions/upload-artifact@v4
        with:
          name: v2max-ci-only-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Stage the exact preview APK that passed the TUN test
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/arena/') && (inputs.publish_test_release || inputs.validate_preview) && !inputs.security_only && !inputs.publish_release && !inputs.ui_diagnostics
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/v2max-preview-tested.sha256"
          mkdir -p "$RUNNER_TEMP/v2max-preview"
          cp app/build/outputs/apk/preview/*universal*preview.apk "$RUNNER_TEMP/v2max-preview/V2max-PREVIEW-universal.apk"
          python3 scripts/verify-preview-apk.py "$RUNNER_TEMP/v2max-preview/V2max-PREVIEW-universal.apk"

      - name: Upload isolated tested preview APK
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/arena/') && (inputs.publish_test_release || inputs.validate_preview) && !inputs.security_only && !inputs.publish_release && !inputs.ui_diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: v2max-preview-tested-apk
          path: ${{ runner.temp }}/v2max-preview/V2max-PREVIEW-universal.apk
          if-no-files-found: error
          retention-days: 7

  security-smoke:
    # Run on main pushes, diagnostics, and explicit stable/preview dispatches.
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.security_only || (github.ref == 'refs/heads/main' && inputs.publish_release) || (startsWith(github.ref, 'refs/heads/arena/') && (inputs.publish_test_release || inputs.validate_preview) && !inputs.publish_release))) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Security emulator API ${{ matrix.api }} (no release APK)
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            backup_only: true
          - api: 30
            backup_only: false
          - api: 35
            backup_only: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify consent backup exclusions
        run: python3 scripts/verify-backup-rules.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: libv2ray-${{ env.LIBV2RAY_VERSION }}
      - name: Verify pinned Xray library
        run: |
          mkdir -p app/libs
          if [ ! -s app/libs/libv2ray.aar ]; then
            curl -fL --retry 3 -o app/libs/libv2ray.aar \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/${{ env.LIBV2RAY_VERSION }}/libv2ray.aar"
          fi
          printf '%s  %s\n' "$LIBV2RAY_SHA256" app/libs/libv2ray.aar | sha256sum --check
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Targeted Android security and backup tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          V2MAX_BACKUP_ONLY: ${{ matrix.backup_only && 'true' || 'false' }}
          V2MAX_CAPTURE_UI: ${{ matrix.api == 30 && inputs.capture_ui && 'true' || 'false' }}
          V2MAX_SELF_UPDATE_TEST: ${{ matrix.api == 35 && 'true' || 'false' }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-android-security-smoke.sh

  release-approval:
    # An explicit release request must fail clearly if the owner has not set
    # the review flag; otherwise skipped sign/publish jobs can look successful.
    # This lightweight check receives no signing secrets and runs in parallel.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release && !inputs.security_only && !inputs.publish_test_release && !inputs.validate_preview && !inputs.ui_diagnostics
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require owner security review approval
        env:
          RELEASE_APPROVED: ${{ vars.V2MAX_RELEASE_APPROVED }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_APPROVED:-}" != true ]]; then
            echo '::error title=release approval::Owner review and V2MAX_RELEASE_APPROVED=true are required before publication.'
            exit 1
          fi
          echo 'Owner release approval flag is set.'

  sign-release:
    # A main push or merge can never sign or publish by itself. After owner
    # review, a separate manual dispatch must run both emulator suites first.
    # This job has no repository write access and never runs Gradle with the key.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release && !inputs.security_only && !inputs.publish_test_release && !inputs.validate_preview && !inputs.ui_diagnostics && vars.V2MAX_RELEASE_APPROVED == 'true'
    needs: [build, security-smoke, release-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17 for Android signing tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download tested CI-only APKs
        uses: actions/download-artifact@v4
        with:
          name: v2max-ci-only-apk
          path: tested-apks
      - name: Verify tested APK identity
        run: python3 scripts/verify-release-metadata.py tested-apks
      - name: Sign the tested payload with the approved release key
        env:
          KEYSTORE_BASE64: ${{ secrets.V2MAX_RELEASE_KEYSTORE_BASE64 }}
          V2MAX_RELEASE_STORE_PASSWORD: ${{ secrets.V2MAX_RELEASE_STORE_PASSWORD }}
          V2MAX_RELEASE_KEY_ALIAS: ${{ secrets.V2MAX_RELEASE_KEY_ALIAS }}
          V2MAX_RELEASE_KEY_PASSWORD: ${{ secrets.V2MAX_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 V2MAX_RELEASE_STORE_PASSWORD V2MAX_RELEASE_KEY_ALIAS V2MAX_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=release signing::Required signing secret $name is not configured"
              exit 1
            fi
          done
          umask 077
          export V2MAX_RELEASE_KEYSTORE="$RUNNER_TEMP/v2max-release.jks"
          trap 'rm -f "$V2MAX_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$V2MAX_RELEASE_KEYSTORE"
          test -s "$V2MAX_RELEASE_KEYSTORE"
          # Re-signs, verifies ZIP alignment and compares every non-signature entry.
          bash scripts/resign-release-apks.sh tested-apks signed-apks
      - name: Verify production signer and package identity
        run: |
          bash scripts/verify-release-signing.sh signed-apks
          python3 scripts/verify-release-metadata.py signed-apks
      - name: Upload verified signed APKs for publication
        uses: actions/upload-artifact@v4
        with:
          name: v2max-production-signed-apk
          path: signed-apks/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    # Write access is isolated from Gradle, emulators and the private signing key.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release && !inputs.security_only && !inputs.publish_test_release && !inputs.validate_preview && !inputs.ui_diagnostics && vars.V2MAX_RELEASE_APPROVED == 'true'
    needs: sign-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: v2max-main-release
      cancel-in-progress: false
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download verified production-signed APKs
        uses: actions/download-artifact@v4
        with:
          name: v2max-production-signed-apk
          path: signed-apks
      - name: Verify signer and package identity again
        id: metadata
        run: |
          bash scripts/verify-release-signing.sh signed-apks
          python3 scripts/verify-release-metadata.py signed-apks
      - name: Publish complete numbered release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          main_sha() { gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'; }
          if [ "$(main_sha)" != "$GITHUB_SHA" ]; then
            echo '::error::main advanced after this run; refusing to publish an older build'
            exit 1
          fi

          # Verify the newest published APK's identity, signer and versionCode.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          [[ "$latest" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo '::error::Unexpected latest release tag'; exit 1; }
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download "$latest" --pattern 'app-arm64-v8a-release.apk' --dir "$RUNNER_TEMP/previous-release"
          bash scripts/verify-release-signing.sh "$RUNNER_TEMP/previous-release"
          python3 scripts/verify-release-metadata.py signed-apks "$RUNNER_TEMP/previous-release/app-arm64-v8a-release.apk"

          TAG="v$VERSION"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          نسخهٔ $VERSION برنامهٔ V2max برای اندروید

          - افزودن کانفیگ و اشتراک با لینک یا QR، و امکان انتخاب دستی سرور
          - بررسی سرورها پیش از اتصال و تلاش برای بازیابی اتصال قطع‌شده
          - پشتیبان‌گیری و اطلاع‌رسانی نسخهٔ جدید با تأیید نصب توسط کاربر
          - فایل universal برای بیشتر دستگاه‌ها؛ فایل‌های دیگر مخصوص معماری دستگاه هستند
          - فایل 00-V2max-universal.apk با app-universal-release.apk یکسان است و برای سازگاری به‌روزرسان نسخهٔ قبلی ارائه می‌شود

          آزمون‌های خودکار روی شبیه‌ساز انجام شده‌اند؛ اتصال روی همهٔ گوشی‌ها و شبکه‌ها تضمین نمی‌شود.
          پایداری و دسترسی به منابع رایگان به شبکه و ارائه‌دهنده بستگی دارد.
          برای به‌روزرسانی روی نصب قبلی، امضای نسخه‌ها باید یکسان باشد.
          EOF
          # Creating a new lightweight tag is atomic and fails if the version/tag
          # already exists. Never overwrite an existing release or its assets.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          [ "$tag_sha" = "$GITHUB_SHA" ] || { echo '::error::Unexpected release tag target'; exit 1; }
          # v2.3.1 selects the first APK in the releases API without checking
          # ABI. GitHub may sort assets by name rather than by upload time, so
          # publish a second, early-sorting copy of the signed universal APK.
          # The draft verifier requires it to be first and byte-identical to
          # the tested canonical universal APK before publication.
          mkdir -p "$RUNNER_TEMP/legacy-update"
          cp signed-apks/app-universal-release.apk "$RUNNER_TEMP/legacy-update/00-V2max-universal.apk"
          gh release create "$TAG" "$RUNNER_TEMP/legacy-update/00-V2max-universal.apk" signed-apks/*.apk --verify-tag --draft \
            --title "V2max $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          # The REST releases/tags endpoint does not return drafts. Resolve the
          # draft through gh and read its numeric release endpoint instead.
          draft_api=$(gh release view "$TAG" --json apiUrl --jq .apiUrl)
          prefix="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/"
          [[ "$draft_api" == "$prefix"* && "${draft_api#"$prefix"}" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Unexpected draft release API URL'; exit 1; }
          gh api "$draft_api" > "$RUNNER_TEMP/draft.json"
          python3 scripts/verify-release-draft.py "$RUNNER_TEMP/draft.json" signed-apks "$TAG"
          # v2.3.1 reads the releases list, not the numeric draft endpoint.
          # Check that representation too before the release becomes public.
          release_id="${draft_api#"$prefix"}"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.id == $release_id)" > "$RUNNER_TEMP/draft-list.json"
          python3 scripts/verify-release-draft.py "$RUNNER_TEMP/draft-list.json" signed-apks "$TAG"
          if [ "$(main_sha)" != "$GITHUB_SHA" ]; then
            echo '::error::main advanced during upload; draft left unpublished for owner review'
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/published-latest.json"
          python3 scripts/verify-release-draft.py "$RUNNER_TEMP/published-latest.json" signed-apks "$TAG" published
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" \
            --jq ".[] | select(.id == $release_id)" > "$RUNNER_TEMP/published-list.json"
          python3 scripts/verify-release-draft.py "$RUNNER_TEMP/published-list.json" signed-apks "$TAG" published
          echo "Published verified release $TAG."

  publish-preview:
    # This is not the production release path. The explicitly requested preview
    # has a separate app ID and ephemeral signer and can never be marked latest.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/arena/') && inputs.publish_test_release && !inputs.security_only && !inputs.publish_release && !inputs.validate_preview && !inputs.ui_diagnostics
    needs: [build, security-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: v2max-preview-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17 for APK verification
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download the exact tested preview APK
        uses: actions/download-artifact@v4
        with:
          name: v2max-preview-tested-apk
          path: preview
      - name: Verify preview identity and non-production signer
        id: preview
        run: python3 scripts/verify-preview-apk.py preview/V2max-PREVIEW-universal.apk
      - name: Publish a verified prerelease, never latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error title=Preview publish::Command failed at script line $LINENO (exit $status)"' ERR
          branch_sha() { gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha'; }
          if [[ "$GITHUB_REF" != refs/heads/arena/* ]] || [[ "$(branch_sha)" != "$GITHUB_SHA" ]]; then
            echo '::error::Preview branch moved or is not an arena branch; refusing publication'
            exit 1
          fi
          TAG="v${VERSION}-preview.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/preview-notes.md" <<'NOTES'
          ## نسخهٔ آزمایشی؛ به‌روزرسانی رسمی نیست

          - این برنامه با شناسهٔ جداگانهٔ `ir.v2max.app.preview` در کنار نسخهٔ رسمی نصب می‌شود و داده‌های آن جداست.
          - امضای آزمایشی موقت است. این APK نسخهٔ رسمی را به‌روزرسانی نمی‌کند و نسخهٔ آزمایشی بعدی نیز ممکن است نیازمند حذف این برنامه باشد؛ حذف، داده‌های نسخهٔ آزمایشی را پاک می‌کند.
          - اندروید معمولاً فقط یک VPN فعال دارد؛ اتصال نسخهٔ آزمایشی ممکن است VPN قبلی را قطع کند.
          - این ساخت بدون R8 و برای آزمون داوطلبانه است. آزمون شبیه‌ساز، عملکرد روی همهٔ گوشی‌ها یا شبکه‌ها را تضمین نمی‌کند.
          - برای بازگشت، اتصال آزمایشی را قطع و نسخهٔ رسمی را دوباره متصل کنید. کلید انتشار رسمی در این فرایند استفاده نشده است.
          NOTES
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release create "$TAG" preview/V2max-PREVIEW-universal.apk --verify-tag --draft --prerelease --latest=false \
            --title "V2max $VERSION — نسخهٔ آزمایشی مجزا" --notes-file "$RUNNER_TEMP/preview-notes.md"
          # A draft is visible by its numeric release ID, not releases/tags.
          draft_api=$(gh release view "$TAG" --json apiUrl --jq .apiUrl)
          prefix="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/"
          [[ "$draft_api" == "$prefix"* && "${draft_api#"$prefix"}" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Unexpected draft release API URL'; exit 1; }
          gh api "$draft_api" > "$RUNNER_TEMP/preview-draft.json"
          python3 scripts/verify-preview-release.py "$RUNNER_TEMP/preview-draft.json" preview/V2max-PREVIEW-universal.apk "$TAG" draft
          if [[ "$(branch_sha)" != "$GITHUB_SHA" ]]; then
            echo '::error::Preview branch advanced; leaving the verified draft unpublished'
            exit 1
          fi
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/preview-published.json"
          python3 scripts/verify-preview-release.py "$RUNNER_TEMP/preview-published.json" preview/V2max-PREVIEW-universal.apk "$TAG" published
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          [[ "$latest" != "$TAG" ]] || { echo '::error::Preview unexpectedly became latest'; exit 1; }
          echo "Published isolated preview $TAG; latest stable remains $latest."

name: Build V2max APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:
    inputs:
      capture_ui:
        description: "Capture a disposable emulator home-screen preview"
        required: false
        type: boolean
        default: false

env:
  LIBV2RAY_VERSION: v26.10.21
  LIBV2RAY_SHA256: e56ec3b06485fe7b37af26948673951edf719c50d6bbc618b8539045952adde4
  XRAY_LINUX_SHA256: 0eec3ed4163c273d8c8bf821f7d219e257921cf584aa3fb970715e458e631978

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify automation consent backup exclusions
        run: python3 scripts/verify-backup-rules.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Cache Xray core (libv2ray.aar)
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: libv2ray-${{ env.LIBV2RAY_VERSION }}

      - name: Download Xray core
        run: |
          mkdir -p app/libs
          if [ ! -s app/libs/libv2ray.aar ]; then
            curl -fL --retry 3 -o app/libs/libv2ray.aar \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/${{ env.LIBV2RAY_VERSION }}/libv2ray.aar"
          fi
          printf '%s  %s\n' "$LIBV2RAY_SHA256" app/libs/libv2ray.aar | sha256sum --check
          ls -la app/libs


      # Never restore a release key from Actions caches, which PR workflows can read.
      # Without explicit owner approval, all APKs use an ephemeral CI-only key.
      - name: Prepare release signing key (approved main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.V2MAX_RELEASE_APPROVED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.V2MAX_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.V2MAX_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.V2MAX_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.V2MAX_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=release signing::Required release-signing secret $name is not configured"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/v2max-release.jks"
          test -s "$RUNNER_TEMP/v2max-release.jks"
          echo "V2MAX_RELEASE_KEYSTORE=$RUNNER_TEMP/v2max-release.jks" >> "$GITHUB_ENV"

      - name: Download matching Xray executable for compatibility tests
        run: |
          mkdir -p "$RUNNER_TEMP/xray"
          curl -fL --retry 3 -o "$RUNNER_TEMP/xray.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${LIBV2RAY_VERSION}/Xray-linux-64.zip"
          printf '%s  %s\n' "$XRAY_LINUX_SHA256" "$RUNNER_TEMP/xray.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/xray.zip" -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          echo "TEST_XRAY_BIN=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

      - name: Run unit and local Xray integration tests
        run: |
          set -o pipefail
          # :core:testsuite is a plain JVM module, so it has no
          # testReleaseUnitTest; it must be named explicitly or its checks never
          # run and a regression in link parsing or config generation would ship.
          gradle --no-daemon :core:testsuite:test testReleaseUnitTest 2>&1 | tee test-out.log

      - name: Verify the core suite actually ran
        run: |
          set -e
          # Guards against the suite being silently skipped again: if the task
          # is ever renamed or dropped from the invocation above, this fails the
          # build instead of reporting success over tests that never executed.
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          paths = glob.glob('core/*/build/test-results/**/*.xml', recursive=True)
          if not paths:
              print('::error title=core-tests::no core test results — :core:testsuite:test did not run')
              sys.exit(1)
          total = 0
          for p in paths:
              for _ in ET.parse(p).iter('testcase'):
                  total += 1
          if total < 1:
              print('::error title=core-tests::core test results contain no test cases')
              sys.exit(1)
          print(f'core suite ran: {total} test case(s) across {len(paths)} result file(s)')

          # Local-Xray tests are intentionally optional on developer machines.
          # CI downloads the pinned executable, so none may be silently skipped here.
          xray_paths = glob.glob('app/build/test-results/**/TEST-*XrayIntegrationTest.xml', recursive=True)
          if not xray_paths:
              print('::error title=xray-tests::no Xray integration results')
              sys.exit(1)
          cases = [case for p in xray_paths for case in ET.parse(p).iter('testcase')]
          if len(cases) < 3 or any(case.find('skipped') is not None for case in cases):
              print('::error title=xray-tests::Xray integration tests missing or skipped')
              sys.exit(1)
          print(f'Xray integration suite ran: {len(cases)} unskipped test case(s)')
          PY

      - name: Report test failures
        if: always()
        run: |
          if [ -f test-out.log ]; then
            grep -E "^e: |FAILED|tests completed|AssertionError|Exception|error:" test-out.log | head -40 | while IFS= read -r line; do
              echo "::error title=tests::$line"
            done
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          patterns = [
              'app/build/test-results/**/*.xml',
              'core/*/build/test-results/**/*.xml',
          ]
          paths = [p for pat in patterns for p in glob.glob(pat, recursive=True)]
          for path in paths:
              for case in ET.parse(path).iter('testcase'):
                  for failure in case.findall('failure'):
                      msg = (failure.get('message') or failure.text or '')[:8000]
                      msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY

      - name: Build release APK
        id: build_apk
        env:
          V2MAX_RELEASE_STORE_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.V2MAX_RELEASE_APPROVED == 'true' && secrets.V2MAX_RELEASE_STORE_PASSWORD || '' }}
          V2MAX_RELEASE_KEY_ALIAS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.V2MAX_RELEASE_APPROVED == 'true' && secrets.V2MAX_RELEASE_KEY_ALIAS || '' }}
          V2MAX_RELEASE_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.V2MAX_RELEASE_APPROVED == 'true' && secrets.V2MAX_RELEASE_KEY_PASSWORD || '' }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build-out.log
        continue-on-error: true

      - name: Report compile errors as annotations
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" != success ] && [ -f build-out.log ]; then
            grep -E "^e: |error:|FAILURE:|What went wrong|Caused by|Missing class|R8:|Execution failed" build-out.log | head -20 | while IFS= read -r line; do
              echo "::error title=build::$line"
            done
            tail -25 build-out.log | while IFS= read -r line; do
              echo "::error title=tail::$line"
            done
          fi
          if [ "$BUILD_OUTCOME" != success ]; then
            echo "::error title=build::release APK task did not succeed"
            exit 1
          fi
          if [ ! -d app/build/outputs/apk/release ] || [ -z "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)" ]; then
            echo "::error title=build::no APK produced"
            exit 1
          fi

      - name: Verify release signer matches installed v2.3.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.V2MAX_RELEASE_APPROVED == 'true'
        run: bash scripts/verify-release-signing.sh

      - name: Check release guard rejects the CI-only key
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || vars.V2MAX_RELEASE_APPROVED != 'true'
        run: |
          set +e
          output=$(bash scripts/verify-release-signing.sh 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ] || ! grep -Fq 'Signer mismatch' <<< "$output"; then
            printf '%s\n' "$output"
            echo '::error::Signing guard did not detect the incompatible CI key'
            exit 1
          fi
          echo 'Release guard correctly rejected the ephemeral CI signer.'

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android VPN/TUN smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          V2MAX_CAPTURE_UI: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_ui && 'true' || 'false' }}
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-android-vpn-smoke.sh

      - name: Android 35 update permission and signer smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-android-update-smoke.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: v2max-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    # Keep write access out of Gradle, tests, third-party dependencies and PR runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.V2MAX_RELEASE_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: v2max-main-release
      cancel-in-progress: false
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
      - name: Download tested APKs
        uses: actions/download-artifact@v4
        with:
          name: v2max-apk
          path: app/build/outputs/apk/release
      - name: Publish APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; not publishing this older run."
            exit 0
          fi
          TAG="apk-latest"
          VERSION=$(grep -m1 "versionName" app/build.gradle.kts | tr -d ' "' | cut -d= -f2)
          {
            echo "APK امضاشده‌ی V2max نسخه‌ی ${VERSION:-1.0.0}"
            echo ""
            echo "- \`app-universal-release.apk\` — برای همه‌ی گوشی‌ها (پیشنهادی)"
            echo "- \`app-arm64-v8a-release.apk\` — سبک‌تر، برای اکثر گوشی‌های امروزی"
            echo "- \`app-armeabi-v7a-release.apk\` — برای گوشی‌های قدیمی‌تر ۳۲ بیتی"
            echo "- \`app-x86_64-release.apk\` — برای شبیه‌سازها"
            echo ""
            echo "پس از نصب، در اولین اجرا اجازه‌ی VPN را بدهید؛ برنامه خودش منابع رایگان را"
            echo "دریافت، تست و بهترین سرور را انتخاب می‌کند."
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "V2max — آخرین نسخه‌ی آماده‌ی نصب" \
              --notes-file release-notes.md --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "V2max — آخرین نسخه‌ی آماده‌ی نصب" \
              --notes-file release-notes.md --latest
          fi
          gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
          echo "released to $TAG"

          # نسخه‌ی شماره‌دار (برای بررسی به‌روزرسانی داخل برنامه)؛ فقط یک‌بار ساخته می‌شود
          # فقط از شاخه‌ی main ساخته می‌شود تا تگ نسخه روی همان کامیت منتشرشده باشد
          if [ -n "$VERSION" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            VTAG="v$VERSION"
            if ! gh release view "$VTAG" >/dev/null 2>&1; then
              head -3 release-notes.md > version-notes.md
              gh release create "$VTAG" --target "$GITHUB_SHA" \
                --title "V2max $VERSION" \
                --notes-file version-notes.md
              gh release upload "$VTAG" app/build/outputs/apk/release/*.apk
              echo "created versioned release $VTAG"
            else
              echo "versioned release $VTAG already exists"
            fi
          fi

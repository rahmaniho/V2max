name: Build V2max APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

env:
  LIBV2RAY_VERSION: v26.10.21

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Cache Xray core (libv2ray.aar)
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: libv2ray-${{ env.LIBV2RAY_VERSION }}

      - name: Download Xray core
        run: |
          mkdir -p app/libs
          if [ ! -s app/libs/libv2ray.aar ]; then
            curl -fL --retry 3 -o app/libs/libv2ray.aar \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/${{ env.LIBV2RAY_VERSION }}/libv2ray.aar"
          fi
          ls -la app/libs


      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: |
            keystore.jks
            keystore.properties
          key: v2max-keystore-v1

      - name: Create signing keystore if needed
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias v2max \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass v2max123 -keypass v2max123 \
              -dname "CN=V2max, OU=Mobile, O=V2max, L=Tehran, C=IR"
            printf 'storeFile=keystore.jks\nstorePassword=v2max123\nkeyAlias=v2max\nkeyPassword=v2max123\n' > keystore.properties
          fi

      - name: Download matching Xray executable for compatibility tests
        run: |
          mkdir -p "$RUNNER_TEMP/xray"
          curl -fL --retry 3 -o "$RUNNER_TEMP/xray.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${LIBV2RAY_VERSION}/Xray-linux-64.zip"
          unzip -q "$RUNNER_TEMP/xray.zip" -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          echo "TEST_XRAY_BIN=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

      - name: Run unit and local Xray integration tests
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest 2>&1 | tee test-out.log

      - name: Report test failures
        if: always()
        run: |
          if [ -f test-out.log ]; then
            grep -E "^e: |FAILED|tests completed|AssertionError|Exception|error:" test-out.log | head -40 | while IFS= read -r line; do
              echo "::error title=tests::$line"
            done
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for case in ET.parse(path).iter('testcase'):
                  for failure in case.findall('failure'):
                      msg = (failure.get('message') or failure.text or '')[:8000]
                      msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY

      - name: Build release APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build-out.log
        continue-on-error: true

      - name: Report compile errors as annotations
        if: always()
        run: |
          if [ -f build-out.log ]; then
            grep -E "^(e|w): |error:|FAILURE:|What went wrong|Caused by|Missing class|R8:|Execution failed" build-out.log | head -20 | while IFS= read -r line; do
              echo "::error title=build::$line"
            done
            tail -25 build-out.log | while IFS= read -r line; do
              echo "::error title=tail::$line"
            done
          fi
          if [ ! -d app/build/outputs/apk/release ] || [ -z "$(ls -A app/build/outputs/apk/release 2>/dev/null)" ]; then
            echo "::error title=build::no APK produced"
            exit 1
          fi

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android VPN/TUN smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-android-vpn-smoke.sh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: v2max-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # انتشار APK در بخش Releases تا لینک دانلود مستقیم و همیشگی داشته باشد
      - name: Publish APKs to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="apk-latest"
          VERSION=$(grep -m1 "versionName" app/build.gradle.kts | tr -d ' "' | cut -d= -f2)
          {
            echo "APK امضاشده‌ی V2max نسخه‌ی ${VERSION:-1.0.0}"
            echo ""
            echo "- \`app-universal-release.apk\` — برای همه‌ی گوشی‌ها (پیشنهادی)"
            echo "- \`app-arm64-v8a-release.apk\` — سبک‌تر، برای اکثر گوشی‌های امروزی"
            echo "- \`app-armeabi-v7a-release.apk\` — برای گوشی‌های قدیمی‌تر ۳۲ بیتی"
            echo "- \`app-x86_64-release.apk\` — برای شبیه‌سازها"
            echo ""
            echo "پس از نصب، در اولین اجرا اجازه‌ی VPN را بدهید؛ برنامه خودش منابع رایگان را"
            echo "دریافت، تست و بهترین سرور را انتخاب می‌کند."
          } > release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "V2max — آخرین نسخه‌ی آماده‌ی نصب" \
            --notes-file release-notes.md --latest
          gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
          echo "released to $TAG"

          # نسخه‌ی شماره‌دار (برای بررسی به‌روزرسانی داخل برنامه)؛ فقط یک‌بار ساخته می‌شود
          # فقط از شاخه‌ی main ساخته می‌شود تا تگ نسخه روی همان کامیت منتشرشده باشد
          if [ -n "$VERSION" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            VTAG="v$VERSION"
            if ! gh release view "$VTAG" >/dev/null 2>&1; then
              head -3 release-notes.md > version-notes.md
              gh release create "$VTAG" \
                --title "V2max $VERSION" \
                --notes-file version-notes.md
              gh release upload "$VTAG" app/build/outputs/apk/release/*.apk
              echo "created versioned release $VTAG"
            else
              echo "versioned release $VTAG already exists"
            fi
          fi
